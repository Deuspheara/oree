name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'benchmark/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.editorconfig'
      - 'assets/avatars/**'
      - 'scripts/export-avatars.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'benchmark/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.editorconfig'
      - 'assets/avatars/**'
      - 'scripts/export-avatars.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and compile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify avatar exports
        run: python3 scripts/export-avatars.py --check
      - name: Check formatting and module boundaries
        run: ./gradlew --no-daemon spotlessCheck verifyArchitecture
      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lintDebug :app:testDebugUnitTest :app:lintDebug
      - name: Compile app, optimized app and device-test APKs
        run: >-
          ./gradlew --no-daemon :app:assembleDebug :app:assembleBenchmarkRelease
          :app:assembleDebugAndroidTest :benchmark:assembleNonMinifiedRelease
      - name: Keep verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/
            app/build/reports/
            core/**/build/reports/
            core/**/build/test-results/
            feature/**/build/reports/
            feature/**/build/test-results/
            app/build/test-results/
      - name: Keep development APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oree-development-apks
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/benchmarkRelease/*.apk
