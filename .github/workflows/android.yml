name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'benchmark/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.editorconfig'
      - 'assets/avatars/**'
      - 'scripts/export-avatars.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'benchmark/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.editorconfig'
      - 'assets/avatars/**'
      - 'scripts/export-avatars.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and compile Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify avatar exports
        run: python3 scripts/export-avatars.py --check
      - name: Check formatting and module boundaries
        run: ./gradlew --no-daemon spotlessCheck verifyArchitecture
      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lintDebug :app:testDebugUnitTest :app:lintDebug
      - name: Compile app, optimized releases and device-test APKs
        run: >-
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleBenchmarkRelease
          :app:assembleDebugAndroidTest :benchmark:assembleNonMinifiedRelease
      - name: Analyze release R8 configuration
        run: ./gradlew --no-daemon :app:analyzeReleaseR8Config
      - name: Keep verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/reports/
            app/build/reports/
            core/**/build/reports/
            core/**/build/test-results/
            feature/**/build/reports/
            feature/**/build/test-results/
            app/build/test-results/
            app/build/outputs/mapping/release/
            app/build/outputs/reports/
      - name: Keep development APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oree-development-apks
          retention-days: 7
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/benchmarkRelease/*.apk

  release:
    name: Prepare signed draft release
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build optimized release APK
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Keep release mapping and R8 report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oree-release-mapping
          retention-days: 90
          if-no-files-found: error
          path: app/build/outputs/mapping/release/
      - name: Sign and verify release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore}"
          : "${RELEASE_STORE_PASSWORD:?Missing keystore password}"
          : "${RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing key password}"
          keyfile="$(mktemp "$RUNNER_TEMP/oree-keystore.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keyfile" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$RUNNER_TEMP/oree-release.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/oree-release.apk"
          cd "$RUNNER_TEMP"
          sha256sum oree-release.apk > oree-release.apk.sha256
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --generate-notes
          "$RUNNER_TEMP/oree-release.apk" "$RUNNER_TEMP/oree-release.apk.sha256"
