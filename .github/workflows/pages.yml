name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/build-site.py'
      - 'scripts/check-site.py'
      - 'docs/screenshots/home.png'
      - 'docs/screenshots/profiles.png'
      - 'assets/avatars/masters/avatar_01.png'
      - 'assets/avatars/masters/avatar_03.png'
      - 'core/platform/src/main/res/drawable-nodpi/landscape_forest.jpg'
      - 'core/model/src/main/java/fr/deuspheara/oree/core/model/VisualExperience.kt'
      - 'core/designsystem/src/main/res/values/strings.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build public files only
        run: python3 scripts/build-site.py
      - name: Check links, assets and slider source parity
        run: python3 scripts/check-site.py
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site-build
  deploy:
    name: Publish GitHub Pages
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
