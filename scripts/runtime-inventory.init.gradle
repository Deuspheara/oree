import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import java.security.MessageDigest

def componentRef = { id -> "pkg:maven/${id.group}/${id.module}@${id.version}" }
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return // Convention-plugin included builds have no application target.
    app.tasks.register('exportRuntimeDependencyInventory') {
        doLast {
            def config = app.configurations.getByName('benchmarkReleaseRuntimeClasspath')
            def resolution = config.incoming.resolutionResult
            def components = resolution.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }
            // Internal library artifacts are application source, not third-party Maven inputs.
            def rawArtifacts = config.incoming.artifactView {
                componentFilter { id -> id instanceof ModuleComponentIdentifier }
            }.artifacts.artifacts.collect { artifact ->
                def id = artifact.id.componentIdentifier
                def digest = MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                [component: componentRef(id), filename: artifact.file.name,
                 bytes: artifact.file.length(), sha256: digest.digest().encodeHex().toString()]
            }.sort { a, b -> a.component <=> b.component ?: a.filename <=> b.filename }
            def artifacts = rawArtifacts.unique(false) { a -> a.component + '|' + a.filename + '|' + a.sha256 }
            def nodes = components.collect { component ->
                def id = component.id
                [ref: componentRef(id), group: id.group, name: id.module, version: id.version,
                 dependencies: component.dependencies.findAll {
                     it instanceof ResolvedDependencyResult && !it.constraint && it.selected.id instanceof ModuleComponentIdentifier
                 }.collect { componentRef(it.selected.id) }.unique().sort()]
            }.sort { it.ref }
            def projectComponents = resolution.allComponents.findAll { it.id instanceof ProjectComponentIdentifier }
            def rootDeps = projectComponents.collectMany { it.dependencies }.findAll {
                it instanceof ResolvedDependencyResult && !it.constraint && it.selected.id instanceof ModuleComponentIdentifier
            }.collect { componentRef(it.selected.id) }.unique().sort()
            def output = app.rootProject.file(app.findProperty('runtimeInventoryOutput') ?: '.private/dependency-audit/runtime-inventory.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schemaVersion: 2, configuration: config.name, rawArtifactSelections: rawArtifacts.size(),
                application: [id: app.android.defaultConfig.applicationId, name: app.rootProject.name, version: app.android.defaultConfig.versionName],
                dependencyEdgesExcludeConstraints: true, projectModulesFoldedIntoApplication: projectComponents.collect { it.id.projectPath }.sort(),
                scope: 'Resolved runtime inputs before R8; metadata platforms/facades can have no artifact. Not proof every input remains in APK.',
                rootDependencies: rootDeps, components: nodes, artifacts: artifacts
            ])) + '\n'
            println "Runtime inventory: ${nodes.size()} components, ${artifacts.size()} artifacts"
        }
    }
}
